<text x="324" y="889.0" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#282b33">示例：查询店铺商品</text>
<text x="324" y="928.0" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#282b33">① 查询可访问店铺     →     ② 选择 shop_id 与 items.search     →     ③ 公司 / 店铺权限校验</text>
<text x="324" y="968.0" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#282b33">④ 映射至对应平台接口并携带店铺 OAuth Token     →     ⑤ 返回商品列表 / 状态</text>
<text x="324" y="1021.0" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="400" fill="#647080">目录示例：GET /api/meli/operations    ·    执行：POST /api/meli/operations/{operation_id}/execute</text>
<polyline points="2175,468 2175,815 445,815 445,503" fill="none" stroke="#1b7e72" stroke-width="3" marker-end="url(#arrow1b7e72)" stroke-dasharray="9 7"/>
<text x="845" y="838.0" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#1b7e72">平台响应 / 错误  →  BFF  →  MCP  →  OpenClaw  →  运营人员</text>
<text x="67" y="1130.0" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#282b33">说明</text>
<text x="67" y="1164.0" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#282b33">• MCP Token、Odoo API Key 与平台 OAuth Token 是三种不同凭据；MCP 按配置映射到 Odoo 用户身份。</text>
<text x="67" y="1198.0" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#282b33">• 本机 MCP 默认监听 127.0.0.1；图中 HTTP 代表当前本地链路，对外访问须另行部署 HTTPS 与访问控制。</text>
<text x="67" y="1232.0" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#282b33">• 统一注册表负责已登记能力；特殊接口逻辑部分位于 meli_bff。图示为调用架构，不代表所有平台接口均已覆盖。</text>
<text x="67" y="1276.0" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#7b818a">源码：deploy/mercado/mcp  ·  deploy/mercado/addons/meli_bff  ·  deploy/mercado/addons/meli_platform_adapter</text>

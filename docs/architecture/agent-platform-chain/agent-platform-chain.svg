<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2150" viewBox="0 0 3200 2150"><rect width="100%" height="100%" fill="white"/><defs><marker id="aink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#343434" stroke-width="1.8"/></marker><marker id="ablue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1971c2" stroke-width="1.8"/></marker><marker id="aorange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#e67700" stroke-width="1.8"/></marker><marker id="agreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#2b8a3e" stroke-width="1.8"/></marker><marker id="ared" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#e03131" stroke-width="1.8"/></marker><marker id="agray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#868e96" stroke-width="1.8"/></marker><marker id="apurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#7950a1" stroke-width="1.8"/></marker></defs><text x="70" y="75" fill="#343434" font-size="40" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="70" dy="0">Agent → MCP → ERP BFF → Platform Proxy → Mercado Libre</tspan></text><text x="75" y="127" fill="#868e96" font-size="25" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="75" dy="0">平台工具调用链路  /  源码核对：MCP 适配层 9514ce8  /  2026-11-07</tspan></text><polyline points="80,180 155,180" fill="none" stroke="#1971c2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ablue)"/><text x="175" y="183" fill="#1971c2" font-size="25" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="175" dy="0">业务请求</tspan></text><polyline points="690,180 765,180" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#agreen)"/><text x="785" y="183" fill="#2b8a3e" font-size="25" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="785" dy="0">结果回传</tspan></text><polyline points="1300,180 1375,180" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ared)"/><text x="1395" y="183" fill="#e03131" font-size="25" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="1395" dy="0">认证边界</tspan></text><path d="M 2038,155 Q 2055.0,153.7 2072,155 Q 2091,156 2090,173 L 2091,181 Q 2090,200 2072,199 Q 2055.0,200.2 2038,199 Q 2019,199 2020,181 L 2019,173 Q 2020,155 2038,155" fill="none" stroke="#868e96" stroke-width="1.7" stroke-dasharray="10 7"/><text x="2110" y="183" fill="#868e96" font-size="25" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2110" dy="0">虚线框：服务职责依据接口契约</tspan></text><path d="M 98,330 Q 370.0,328.7 642,330 Q 661,331 660,348 L 661,832 Q 660,851 642,850 Q 370.0,851.2 98,850 Q 79,850 80,832 L 79,348 Q 80,330 98,330" fill="none" stroke="#343434" stroke-width="1.7" /><text x="100" y="373" fill="#343434" font-size="28" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="100" dy="0">Agent / MCP Client</tspan></text><polyline points="96,388 644,388" fill="none" stroke="#343434" stroke-width="1.8" stroke-linejoin="round" /><text x="100" y="426" fill="#343434" font-size="24" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="100" dy="0">理解用户目标 / 选择业务工具</tspan><tspan x="100" dy="32.400000000000006">先发现模块，再读取参数 Schema</tspan><tspan x="100" dy="32.400000000000006">调用 listing_call</tspan><tspan x="100" dy="32.400000000000006">读取结构化结果 / 决定后续动作</tspan><tspan x="100" dy="32.400000000000006"></tspan><tspan x="100" dy="32.400000000000006">MCP 宿主启动本地 Node 子进程</tspan><tspan x="100" dy="32.400000000000006">服务凭证由宿主配置注入</tspan><tspan x="100" dy="32.400000000000006">模型工具参数中无需传 Token</tspan></text><path d="M 1108,330 Q 1550.0,328.7 1992,330 Q 2011,331 2010,348 L 2011,832 Q 2010,851 1992,850 Q 1550.0,851.2 1108,850 Q 1089,850 1090,832 L 1089,348 Q 1090,330 1108,330" fill="none" stroke="#343434" stroke-width="1.7" /><text x="1110" y="373" fill="#343434" font-size="28" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="1110" dy="0">MCP 适配层  /  stdio server</tspan></text><polyline points="1106,388 1994,388" fill="none" stroke="#343434" stroke-width="1.8" stroke-linejoin="round" /><text x="1110" y="426" fill="#343434" font-size="24" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="1110" dy="0">① listing_module_router</tspan><tspan x="1110" dy="32.400000000000006">② listing_operations_for_modules</tspan><tspan x="1110" dy="32.400000000000006">③ listing_list_operations  [全部目录]</tspan><tspan x="1110" dy="32.400000000000006">④ listing_call(operation, arguments)</tspan><tspan x="1110" dy="32.400000000000006"></tspan><tspan x="1110" dy="32.400000000000006">operation 白名单 → Zod 参数校验 → handler</tspan><tspan x="1110" dy="32.400000000000006">Mercado Libre：ml_native / ml_cbt</tspan><tspan x="1110" dy="32.400000000000006">Axios → ERP BFF；JSON / query / multipart</tspan></text><path d="M 2468,330 Q 2775.0,328.7 3082,330 Q 3101,331 3100,348 L 3101,832 Q 3100,851 3082,850 Q 2775.0,851.2 2468,850 Q 2449,850 2450,832 L 2449,348 Q 2450,330 2468,330" fill="none" stroke="#343434" stroke-width="1.7" stroke-dasharray="10 7"/><text x="2470" y="373" fill="#343434" font-size="28" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2470" dy="0">ERP BFF  /  接口入口</tspan></text><polyline points="2466,388 3084,388" fill="none" stroke="#343434" stroke-width="1.8" stroke-linejoin="round" /><text x="2470" y="426" fill="#343434" font-size="24" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2470" dy="0">/api/proxy/platform/*</tspan><tspan x="2470" dy="32.400000000000006">校验 ERP Bearer Token</tspan><tspan x="2470" dy="32.400000000000006">RBAC / 租户 / 店铺归属校验</tspan><tspan x="2470" dy="32.400000000000006">按平台接口路由转发</tspan><tspan x="2470" dy="32.400000000000006"></tspan><tspan x="2470" dy="32.400000000000006">shopId = ERP shops.id</tspan><tspan x="2470" dy="32.400000000000006">不是 Mercado Libre seller ID</tspan><tspan x="2470" dy="32.400000000000006">内部实现：本次未取得源码</tspan></text><path d="M 2468,1120 Q 2775.0,1118.7 3082,1120 Q 3101,1121 3100,1138 L 3101,1492 Q 3100,1511 3082,1510 Q 2775.0,1511.2 2468,1510 Q 2449,1510 2450,1492 L 2449,1138 Q 2450,1120 2468,1120" fill="none" stroke="#343434" stroke-width="1.7" stroke-dasharray="10 7"/><text x="2470" y="1163" fill="#343434" font-size="28" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2470" dy="0">Platform Proxy</tspan></text><polyline points="2466,1178 3084,1178" fill="none" stroke="#343434" stroke-width="1.8" stroke-linejoin="round" /><text x="2470" y="1216" fill="#343434" font-size="24" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2470" dy="0">按 shopId 定位平台授权</tspan><tspan x="2470" dy="32.400000000000006">管理平台 OAuth / Access Token</tspan><tspan x="2470" dy="32.400000000000006">将业务路由映射到平台 API</tspan><tspan x="2470" dy="32.400000000000006">Native / CBT 接口适配</tspan><tspan x="2470" dy="32.400000000000006">回传平台结果 / 错误</tspan><tspan x="2470" dy="32.400000000000006">内部实现：本次未取得源码</tspan></text><path d="M 1108,1120 Q 1550.0,1118.7 1992,1120 Q 2011,1121 2010,1138 L 2011,1492 Q 2010,1511 1992,1510 Q 1550.0,1511.2 1108,1510 Q 1089,1510 1090,1492 L 1089,1138 Q 1090,1120 1108,1120" fill="none" stroke="#343434" stroke-width="1.7" stroke-dasharray="10 7"/><text x="1110" y="1163" fill="#343434" font-size="28" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="1110" dy="0">Mercado Libre API</tspan></text><polyline points="1106,1178 1994,1178" fill="none" stroke="#343434" stroke-width="1.8" stroke-linejoin="round" /><text x="1110" y="1216" fill="#343434" font-size="24" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="1110" dy="0">Native：卖家 / 刊登 / 订单 / 消息 / 类目</tspan><tspan x="1110" dy="32.400000000000006">CBT：Global Selling / 子站点 / variation</tspan><tspan x="1110" dy="32.400000000000006"></tspan><tspan x="1110" dy="32.400000000000006">读取卖家示例：GET /users/me</tspan><tspan x="1110" dy="32.400000000000006">创建 CBT 示例：POST /global/items</tspan><tspan x="1110" dy="32.400000000000006">示例映射依据工具描述；未进行线上调用</tspan></text><polyline points="660,485 1090,485" fill="none" stroke="#1971c2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ablue)"/><text x="720" y="446" fill="#1971c2" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="720" dy="0">1. MCP tools/call</tspan></text><text x="720" y="528" fill="#1971c2" font-size="23" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="720" dy="0">JSON-RPC / stdin</tspan></text><polyline points="1090,680 660,680" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#agreen)"/><text x="700" y="726" fill="#2b8a3e" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="700" dy="0">6. MCP content / stdout</tspan></text><polyline points="2010,485 2450,485" fill="none" stroke="#1971c2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ablue)"/><text x="2090" y="446" fill="#1971c2" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2090" dy="0">2. HTTP(S) 请求</tspan></text><text x="2050" y="543" fill="#e03131" font-size="23" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2050" dy="0">Authorization: Bearer</tspan></text><text x="2130" y="578" fill="#e03131" font-size="23" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2130" dy="0">&lt;ERP Token&gt;</tspan></text><polyline points="2450,700 2010,700" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#agreen)"/><text x="2070" y="751" fill="#2b8a3e" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2070" dy="0">5. HTTP status + body</tspan></text><polyline points="2820,850 2820,1120" fill="none" stroke="#1971c2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ablue)"/><text x="2520" y="941" fill="#1971c2" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2520" dy="0">3. 店铺上下文 / 路由</tspan></text><polyline points="3010,1120 3010,850" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#agreen)"/><text x="3030" y="981" fill="#2b8a3e" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="3030" dy="0">结果</tspan></text><polyline points="2450,1265 2010,1265" fill="none" stroke="#1971c2" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ablue)"/><text x="2060" y="1226" fill="#1971c2" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2060" dy="0">4. HTTPS + 平台 Token</tspan></text><polyline points="2010,1420 2450,1420" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#agreen)"/><text x="2100" y="1471" fill="#2b8a3e" font-size="21" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="2100" dy="0">响应 / 平台错误</tspan></text><path d="M 98,1050 Q 485.0,1048.7 872,1050 Q 891,1051 890,1068 L 891,1492 Q 890,1511 872,1510 Q 485.0,1511.2 98,1510 Q 79,1510 80,1492 L 79,1068 Q 80,1050 98,1050" fill="none" stroke="#868e96" stroke-width="1.7" stroke-dasharray="10 7"/><text x="105" y="1098" fill="#7950a1" font-size="28" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="105" dy="0">链路边界 / 阅读说明</tspan></text><text x="105" y="1159" fill="#343434" font-size="24" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="105" dy="0">MCP 负责工具适配与参数校验。</tspan><tspan x="105" dy="32.400000000000006">ERP BFF 负责业务访问入口与权限。</tspan><tspan x="105" dy="32.400000000000006">Platform Proxy 负责平台授权与 API 适配。</tspan><tspan x="105" dy="32.400000000000006"></tspan><tspan x="105" dy="32.400000000000006">ERP Token 与 Mercado Libre Token 分属两层。</tspan><tspan x="105" dy="32.400000000000006">本地入口已实现 stdio；没有启动 HTTP MCP。</tspan><tspan x="105" dy="32.400000000000006">Amazon 工具同包存在，本图聚焦美客多。</tspan><tspan x="105" dy="32.400000000000006">返回路径与调用路径相反。</tspan></text><path d="M 83,1620 Q 1590.0,1618.7 3097,1620 Q 3116,1621 3115,1638 L 3116,2042 Q 3115,2061 3097,2060 Q 1590.0,2061.2 83,2060 Q 64,2060 65,2042 L 64,1638 Q 65,1620 83,1620" fill="none" stroke="#868e96" stroke-width="1.7" /><text x="95" y="1672" fill="#343434" font-size="32" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="95" dy="0">一次只读调用如何穿过这五层</tspan></text><text x="100" y="1736" fill="#1971c2" font-size="26" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="100" dy="0">Agent → MCP</tspan></text><text x="490" y="1737" fill="#343434" font-size="27" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="490" dy="0">listing_call({ operation: &quot;listing_seller_me&quot;, arguments: { shopId: 123 } })</tspan></text><text x="100" y="1796" fill="#1971c2" font-size="26" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="100" dy="0">MCP → ERP BFF</tspan></text><text x="490" y="1797" fill="#343434" font-size="27" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="490" dy="0">GET /api/proxy/platform/api/listings/shops/123/seller/me  +  ERP Bearer Token</tspan></text><text x="100" y="1856" fill="#1971c2" font-size="26" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="100" dy="0">BFF → Proxy → ML</tspan></text><text x="490" y="1857" fill="#343434" font-size="27" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="490" dy="0">校验店铺访问权 → 选择平台授权 → GET /users/me  [上游映射来自工具契约]</tspan></text><text x="100" y="1916" fill="#2b8a3e" font-size="26" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="100" dy="0">结果 → Agent</tspan></text><text x="490" y="1916" fill="#343434" font-size="26" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="490" dy="0">MCP content[0].text = JSON.stringify({ httpStatus, body })；HTTP ≥ 400 标记 isError</tspan></text><text x="100" y="2005" fill="#868e96" font-size="25" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="100" dy="0">本地校验失败不发 HTTP；网络异常返回 HANDLER_ERROR。适配层禁用重定向，写操作不自动重试。</tspan></text><text x="80" y="2114" fill="#868e96" font-size="24" font-family="Chalkboard, PingFang SC, Arial Unicode MS, sans-serif"><tspan x="80" dy="0">实线组件与接口已按本地 MCP 源码核对；虚线服务依据项目 README / 工具描述，未声称已部署或联调成功。</tspan></text></svg>